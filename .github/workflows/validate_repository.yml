name: Validate repository manifests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install "pandas==2.3.3"
      - run: python scripts/validate_repository.py
      - run: python scripts/verify_package_checksums.py
